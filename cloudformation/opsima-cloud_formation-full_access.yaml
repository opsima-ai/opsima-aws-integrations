AWSTemplateFormatVersion: '2010-09-09'
Description: 'Opsima remote access setup'

Rules:
  OpsimaRegionCheck:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', 'eu-west-1']
        AssertDescription: >-
          This Opsima stack must be deployed in eu-west-1 (Ireland). The resources
          it creates are global and work for all regions, but the deployment
          notification is only received from eu-west-1. Please switch region and
          retry.

Parameters:
  ExternalID:
    Type: String
    Description: '(DO NOT CHANGE) External ID generated by Opsima to provide secure access to your AWS account'
    NoEcho: true
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  OpsimaPrincipal:
    Type: String
    Description: '(DO NOT CHANGE) Opsima AWS account ID used to access your AWS account'
    NoEcho: true
    AllowedPattern: '^[0-9]{12}$'
  CreateCURBucket:
    Type: String
    Default: 'true'
    Description: '(DO NOT CHANGE) Whether to create the CUR report bucket'
    AllowedValues:
      - 'true'
      - 'false'
  CreateOpsimaOrganizationalUnit:
    Type: String
    Default: 'true'
    Description: '(DO NOT CHANGE) Whether to create the Opsima Organizational Unit'
    AllowedValues:
      - 'true'
      - 'false'
  CustomerShortId:
    Type: String
    Description: '(DO NOT CHANGE) Short ID generated by Opsima for the customer'
    NoEcho: true
    AllowedPattern: '^[0-9a-fA-F]{10}$'
  OrganizationId:
    Type: String
    Description: '(DO NOT CHANGE) Customer Organization ID'
    AllowedPattern: '^o-[a-z0-9]{10}$'
  OrganizationRootId:
    Type: String
    Description: '(DO NOT CHANGE) Customer Organization Root ID'
    AllowedPattern: '^r-[a-z0-9]{4,32}$'
  OpsimaOrganizationalUnitId:
    Type: String
    Description: '(DO NOT CHANGE) Organizational Unit ID where Opsima managed accounts will be placed. Automatically created if not provided.'
    AllowedPattern: '^$|^ou-[a-z0-9]{4,32}-[a-z0-9]{8,32}$'
  OpsimaInvoiceUnitArn:
    Type: String
    Description: '(DO NOT CHANGE) Invoice Unit ARN where Opsima managed accounts will be placed. Automatically created if not provided.'
    AllowedPattern: '^$|^arn:aws:invoicing::\d{12}:invoice-unit\/[A-Za-z0-9-]+$'

Conditions:
  ShouldCreateCURBucket: !Equals [ !Ref CreateCURBucket, 'true' ]
  ShouldCreateOpsimaOrganizationalUnit: !And
    - !Equals [ !Ref OpsimaOrganizationalUnitId, '' ]
    - !Equals [ !Ref CreateOpsimaOrganizationalUnit, 'true' ]

Resources:
  CURBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    Condition: ShouldCreateCURBucket
    Properties:
      BucketName: !Sub 'opsima-cur-${CustomerShortId}'
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-cur-reports
            Status: Enabled
            ExpirationInDays: 1130
      Tags:
        - Key: owner
          Value: opsima

  CURBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    DependsOn: CURBucket
    Condition: ShouldCreateCURBucket
    Properties:
      Bucket: !Ref CURBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransportAll
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CURBucket.Arn
              - !Sub '${CURBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowBCMDataExportsServiceWriteObjects
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetBucketAcl
              - s3:GetBucketPolicy
            Resource:
              - !GetAtt CURBucket.Arn
              - !Sub '${CURBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bcm-data-exports:*:${AWS::AccountId}:export/*'

  OpsimaOrganizationalUnit:
    Type: AWS::Organizations::OrganizationalUnit
    DeletionPolicy: RetainExceptOnCreate
    Condition: ShouldCreateOpsimaOrganizationalUnit
    Properties:
      Name: !Sub 'opsima-${CustomerShortId}'
      ParentId: !Ref OrganizationRootId
      Tags:
        - Key: owner
          Value: opsima

  OpsimaRemoteAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpsimaRemoteAccessRole
      Tags:
        - Key: owner
          Value: opsima
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref OpsimaPrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalID

  OpsimaRemoteAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: OpsimaRemoteAccessRolePolicy
      Roles:
        - !Ref OpsimaRemoteAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOpsimaCoreOperations
            Effect: Allow
            Resource: '*'
            Action:
              - bcm-data-exports:CreateExport
              - bcm-data-exports:TagResource
              - bcm-data-exports:ListExports
              - bcm-data-exports:GetExport
              - ce:GetSavingsPlansCoverage
              - ce:GetSavingsPlansUtilization
              - ce:GetReservationCoverage
              - ce:GetReservationUtilization
              - ce:GetCostAndUsage
              - ce:GetDimensionValues
              - cur:PutReportDefinition
              - cur:DescribeReportDefinitions
              - cur:TagResource
              - organizations:ListAccounts
              - organizations:ListTagsForResource
              - organizations:DescribeCreateAccountStatus
              - invoicing:CreateInvoiceUnit
              - invoicing:GetInvoiceUnit
              - invoicing:UpdateInvoiceUnit
              - invoicing:TagResource
          - Sid: AllowOrganizationCreateInviteAccount
            Effect: Allow
            Action:
              - organizations:CreateAccount
              - organizations:InviteAccountToOrganization
            Condition:
              StringEquals:
                "aws:RequestTag/owner": "opsima"
            Resource: '*'
          - Sid: AllowOrganizationMoveOpsimaAccount
            Effect: Allow
            Action:
              - organizations:MoveAccount
            Resource: !Sub 'arn:aws:organizations::${AWS::AccountId}:account/${OrganizationId}/*'
            Condition:
              StringEquals:
                "aws:ResourceTag/owner": "opsima"
          - Sid: AllowOrganizationMoveOpsimaAccountParents
            Effect: Allow
            Action:
              - organizations:MoveAccount
            Resource:
              - !Sub 'arn:aws:organizations::${AWS::AccountId}:root/*'
              - !Sub
                - 'arn:aws:organizations::${AWS::AccountId}:ou/${OrganizationId}/${OuId}'
                - OuId: !If
                  - ShouldCreateOpsimaOrganizationalUnit
                  - !GetAtt OpsimaOrganizationalUnit.Id
                  - !Ref OpsimaOrganizationalUnitId
          - Sid: AllowOrganizationTagOpsimaAccounts
            Effect: Allow
            Action:
              - organizations:TagResource
            Resource: '*'
            Condition:
              StringEquals:
                "aws:RequestTag/owner": "opsima"
                "aws:RequestTag/role": "OpsimaOrganizationAccountAccessRole"
              ForAllValues:StringEquals:
                "aws:TagKeys":
                  - owner
                  - role
          - Sid: AllowAssumeRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: arn:aws:iam::*:role/OpsimaOrganizationAccountAccessRole
          - Sid: AllowCURBucketAccess
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !Sub 'arn:aws:s3:::opsima-cur-${CustomerShortId}'
              - !Sub 'arn:aws:s3:::opsima-cur-${CustomerShortId}/*'
          - Sid: AllowOrganizationsAccountQuotaIncrease
            Effect: Allow
            Action:
              - servicequotas:RequestServiceQuotaIncrease
            Resource: !Sub 'arn:aws:servicequotas::${AWS::AccountId}:organizations/L-E619E033'

  OpsimaHandshake:
    Type: Custom::OpsimaHandshake
    DependsOn: OpsimaRemoteAccessPolicy
    Properties:
      ServiceToken: arn:aws:sns:eu-west-1:539247457822:OpsimaLimitedAccessRoleSetup
      CloudFormationStackVersion: '10'
      CloudFormationStackType: full
      RoleArn: !GetAtt OpsimaRemoteAccessRole.Arn
      ExternalID: !Ref ExternalID
      OrganizationId: !Ref OrganizationId
      OrganizationRootId: !Ref OrganizationRootId
      OpsimaOrganizationalUnitId: !If
        - ShouldCreateOpsimaOrganizationalUnit
        - !GetAtt OpsimaOrganizationalUnit.Id
        - !Ref OpsimaOrganizationalUnitId
      OpsimaInvoiceUnitArn: !Ref OpsimaInvoiceUnitArn

Outputs:
  RoleArn:
    Description: 'IAM Remote Access Role ARN used by Opsima'
    Value: !GetAtt OpsimaRemoteAccessRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OpsimaRemoteAccessRoleArn"
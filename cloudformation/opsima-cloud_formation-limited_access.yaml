AWSTemplateFormatVersion: '2010-09-09'
Description: 'Opsima limited access role setup'

Rules:
  OpsimaRegionCheck:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', 'eu-west-1']
        AssertDescription: >-
          This Opsima stack must be deployed in eu-west-1 (Ireland). The resources
          it creates are global and work for all regions, but the deployment
          notification is only received from eu-west-1. Please switch region and
          retry.

Parameters:
  ExternalID:
    Type: String
    Description: 'External ID generated by Opsima to provide secure access to your AWS account'
    NoEcho: true
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  OpsimaPrincipal:
    Type: String
    Description: 'Opsima AWS account ID used to access your AWS account'
    NoEcho: true
    AllowedPattern: '^[0-9]{12}$'

Resources:
  OpsimaLimitedAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpsimaLimitedAccessRole
      Tags:
        - Key: owner
          Value: opsima
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref OpsimaPrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalID

  OpsimaLimitedAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: OpsimaLimitedAccessRolePolicy
      Roles:
        - !Ref OpsimaLimitedAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CostExplorerReadAccess
            Effect: Allow
            Resource: '*'
            Action:
              - ce:GetSavingsPlansCoverage
              - ce:GetSavingsPlansUtilization
              - ce:GetReservationCoverage
              - ce:GetReservationUtilization
              - ce:GetCostAndUsage
              - ce:GetDimensionValues

  OpsimaHandshake:
    Type: Custom::OpsimaHandshake
    DependsOn: OpsimaLimitedAccessPolicy
    Properties:
      ServiceToken: arn:aws:sns:eu-west-1:539247457822:OpsimaLimitedAccessRoleSetup
      CloudFormationStackVersion: '5'
      CloudFormationStackType: limited
      RoleArn: !GetAtt OpsimaLimitedAccessRole.Arn
      ExternalID: !Ref ExternalID

Outputs:
  RoleArn:
    Description: 'IAM Limited Access Role ARN used by Opsima'
    Value: !GetAtt OpsimaLimitedAccessRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OpsimaLimitedAccessRoleArn"